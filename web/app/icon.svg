<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep vibrant teal glass tint -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Glossy specular light reflection on upper glass surface -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Polished glass bevel border reflection -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Subtle depth for suspended glyph -->
    <filter id="glassDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#042f2e" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Glass Base -->
  <rect width="32" height="32" rx="8" fill="url(#glassBg)" />

  <!-- Diagonal Glass Gloss Sheen -->
  <path d="M0 8C0 3.58 3.58 0 8 0h16c4.42 0 8 3.58 8 8v5C21 16 11 12 0 16V8z" fill="url(#glassGloss)" />

  <!-- Suspended Brand Glyph from reference -->
  <g transform="translate(4, 4)" filter="url(#glassDepth)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18" />
      <path d="M3 12h5l2-3 3 6 2-3h6" />
      <path d="M3 18h18" />
    </svg>
  </g>

  <!-- Outer Glass Rim / Border Reflection -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="url(#glassRim)" stroke-width="1" />
</svg>
