<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <linearGradient id="appleGlassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="appleGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <filter id="appleGlassDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#042f2e" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glass Base -->
  <rect width="180" height="180" rx="42" fill="url(#appleGlassBg)" />

  <!-- Diagonal Glass Specular Sheen -->
  <path d="M0 42C0 18.8 18.8 0 42 0h96c23.2 0 42 18.8 42 42v32C122 98 62 70 0 92V42z" fill="url(#appleGlassGloss)" />

  <!-- Suspended Brand Glyph -->
  <g transform="translate(26, 26)" filter="url(#appleGlassDepth)">
    <svg width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18" />
      <path d="M3 12h5l2-3 3 6 2-3h6" />
      <path d="M3 18h18" />
    </svg>
  </g>

  <!-- Outer Glass Rim / Border Reflection -->
  <rect x="2" y="2" width="176" height="176" rx="40" fill="none" stroke="url(#appleGlassRim)" stroke-width="3" />
</svg>
